<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName explore.brk.zone

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3333/
    ProxyPassReverse / http://127.0.0.1:3333/

SSLCertificateFile /etc/letsencrypt/live/explore.brk.zone/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/explore.brk.zone/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
